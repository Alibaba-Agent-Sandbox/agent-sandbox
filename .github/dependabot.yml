# Dependabot configuration for the agent-sandbox CLI
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Node.js (npm) dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
    open-pull-requests-limit: 10
    # Major migrations require an explicit compatibility change and acceptance.
    # Keep automatic patch/minor updates within the supported Node 20/22 stack.
    ignore:
      - dependency-name: "commander"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    commit-message:
      prefix: "chore(ci):"
    open-pull-requests-limit: 5
