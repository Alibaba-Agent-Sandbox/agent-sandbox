name: Release Binary

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: write  # required to upload assets to the GitHub Release

jobs:
  build-binary:
    name: Build abx binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest    -> linux-x64
        # macos-latest     -> darwin-arm64 (Apple Silicon)
        # macos-15-intel   -> darwin-x64   (Intel; macos-13 has been retired)
        # windows-latest   -> windows-x64
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-latest
            target: windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (includes the esbuild + postject build toolchain)
        run: npm ci

      - name: Require the matching package version for tag uploads
        if: github.event_name == 'push'
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) throw new Error('Release tag must match package.json')"

      - name: Install and verify the actual npm tarball on this platform
        shell: bash
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/abx-npm-pack"
          npm pack --pack-destination "$RUNNER_TEMP/abx-npm-pack"
          npm install --global --prefix "$RUNNER_TEMP/abx-npm-install" "$RUNNER_TEMP"/abx-npm-pack/*.tgz
          if [ "$RUNNER_OS" = "Windows" ]; then
            executable="$RUNNER_TEMP/abx-npm-install/abx.cmd"
          else
            executable="$RUNNER_TEMP/abx-npm-install/bin/abx"
          fi
          node scripts/check-release-artifact.mjs "$executable"

      - name: Build binary
        run: node scripts/build_binary.mjs

      - name: Verify the actual executable and complete notices
        run: node scripts/check-release-artifact.mjs dist/binary

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist/binary
          for f in abx-*; do
            case "$f" in *.sha256) continue ;; esac
            [ -f "$f" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
            cat "$f.sha256"
          done

      # Manual runs expose artifacts only. A tag push uploads verified binaries
      # to a draft release; publish the draft after every platform is complete.
      - name: Upload workflow artifacts (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: abx-binary-${{ matrix.target }}
          path: dist/binary/
          if-no-files-found: error

      - name: Upload binaries to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/binary/abx-*
