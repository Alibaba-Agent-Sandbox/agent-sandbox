name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish using the current recovery workflow"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify and publish npm package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Recovery keeps the released source immutable while fixing the publisher.
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Require a matching version tag
        env:
          SOURCE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "v${pkg_version}" != "$SOURCE_TAG" ]; then
            echo "Publish only the source tag matching package.json."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Run recovery from the default branch."; exit 1; }
          else
            [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "A published release must reference a tag."; exit 1; }
          fi
          if [[ "$pkg_version" == *-* ]]; then
            echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Install locked dependencies
        run: npm ci
      - name: Check out the reviewed server test fixtures
        uses: actions/checkout@v4
        with:
          repository: Alibaba-Agent-Sandbox/python-sdk
          ref: d4d93e8cbb986f33a8868f7a4139ed0edb49eaba
          path: vendor/python-sdk
          sparse-checkout: server-sdk/src
          sparse-checkout-cone-mode: false
      - name: Check out the reviewed provider test fixtures
        uses: actions/checkout@v4
        with:
          repository: Alibaba-Agent-Sandbox/awesome-providers
          ref: bcc0016ad5285a0426d35c55085728d9ddd72141
          path: vendor/awesome-providers
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        env:
          ABX_SERVER_SDK_SRC: ${{ github.workspace }}/vendor/python-sdk/server-sdk/src
          ABX_AWESOME_PROVIDERS: ${{ github.workspace }}/vendor/awesome-providers
        run: npm test
      - name: Pack and install the exact publication artifact
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          npm install --global --prefix "$RUNNER_TEMP/abx-candidate" ./dist-pack/*.tgz
          node scripts/check-release-artifact.mjs "$RUNNER_TEMP/abx-candidate/bin/abx"
      - name: Preserve the tested npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-candidate
          path: ./dist-pack/*.tgz
          if-no-files-found: error
      - name: Publish the tested tarball with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
        run: npm publish ./dist-pack/*.tgz --provenance --access public --tag "$NPM_DIST_TAG"
      - name: Install from the public npm registry
        run: |
          version="$(node -p "require('./package.json').version")"
          installed=false
          for attempt in 1 2 3 4 5 6; do
            if npm install --global --prefix "$RUNNER_TEMP/abx-public" "@agent-sandbox/cli@$version" --registry=https://registry.npmjs.org; then
              installed=true
              break
            fi
            sleep 5
          done
          [ "$installed" = true ]
          node scripts/check-release-artifact.mjs "$RUNNER_TEMP/abx-public/bin/abx"
