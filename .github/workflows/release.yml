name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish using the current recovery workflow"
        required: true
        type: string
      diagnostics_only:
        description: "Check npm identity and scope access without publishing"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only npm credential diagnostics
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check npm identity and target scope without publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          // Capture upstream output: usernames, package lists and raw errors never enter logs.
          function query(args) {
            const result = spawnSync('npm', [...args, '--json', '--registry=https://registry.npmjs.org',
              '--fetch-retries=0', '--fetch-timeout=15000', '--logs-max=0'],
              { encoding: 'utf8', timeout: 20000, maxBuffer: 1024 * 1024 });
            let data;
            try { data = JSON.parse(result.stdout); } catch { /* Report only a static classification. */ }
            if (result.status === 0 && data !== undefined) return { ok: true, data };
            const code = data?.error?.code;
            const allowed = ['E401', 'E403', 'E404', 'ENEEDAUTH', 'EOTP', 'ETIMEDOUT', 'ECONNRESET', 'ENOTFOUND'];
            return { ok: false, code: allowed.includes(code) ? code : 'UNKNOWN_ERROR' };
          }
          const report = { credential_present: Boolean(process.env.NODE_AUTH_TOKEN), identity_authenticated: false };
          if (report.credential_present) {
            const identity = query(['whoami']);
            if (identity.ok && typeof identity.data === 'string' && /^[a-z0-9][a-z0-9._-]*$/i.test(identity.data)) {
              report.identity_authenticated = true;
              report.scope_matches_account = identity.data === 'agent-sandbox';
              const org = query(['org', 'ls', 'agent-sandbox', identity.data]);
              report.organization_membership = org.ok
                ? (Object.hasOwn(org.data ?? {}, identity.data) ? 'confirmed' : 'not_reported') : 'unknown';
              if (!org.ok) report.organization_check_error = org.code;
              const packages = query(['access', 'list', 'packages', identity.data, '@agent-sandbox/cli']);
              const access = packages.data?.['@agent-sandbox/cli'];
              report.target_package_access = packages.ok
                ? (['read-only', 'read-write'].includes(access) ? access : 'not_reported') : 'unknown';
              if (!packages.ok) report.package_check_error = packages.code;
            } else {
              report.identity_error = identity.ok ? 'INVALID_RESPONSE' : identity.code;
            }
          }
          console.log(JSON.stringify(report, null, 2));
          console.log('Read-only checks do not establish first-publication permission, token write scope or 2FA bypass.');
          NODE

  publish:
    if: github.event_name != 'workflow_dispatch' || !inputs.diagnostics_only
    name: Build, verify and publish npm package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Recovery keeps the released source immutable while fixing the publisher.
          ref: refs/tags/${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Require a matching version tag
        env:
          SOURCE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "v${pkg_version}" != "$SOURCE_TAG" ]; then
            echo "Publish only the source tag matching package.json."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Run recovery from the default branch."; exit 1; }
          else
            [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "A published release must reference a tag."; exit 1; }
          fi
          if [[ "$pkg_version" == *-* ]]; then
            echo "NPM_DIST_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_DIST_TAG=latest" >> "$GITHUB_ENV"
          fi

      - name: Validate provenance repository identity
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const repository = process.env.GITHUB_REPOSITORY ?? '';
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository)) {
            throw new Error('A GitHub repository identity is required.');
          }
          const expected = `git+https://github.com/${repository}.git`;
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const actual = pkg.repository?.url;
          if (typeof actual !== 'string' || actual.toLowerCase() !== expected.toLowerCase()) {
            throw new Error('Package repository must identify the publishing repository; only capitalization may differ.');
          }
          if (actual !== expected) {
            pkg.repository.url = expected;
            writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Corrected repository URL capitalization before testing and packaging.');
          }
          NODE
      - name: Record source and workflow revisions
        run: |
          echo "Release source commit: $(git rev-parse HEAD)"
          echo "Publisher workflow commit: $GITHUB_SHA"

      - name: Install locked dependencies
        run: npm ci
      - name: Check out the reviewed server test fixtures
        uses: actions/checkout@v4
        with:
          repository: Alibaba-Agent-Sandbox/python-sdk
          ref: d4d93e8cbb986f33a8868f7a4139ed0edb49eaba
          path: vendor/python-sdk
          sparse-checkout: server-sdk/src
          sparse-checkout-cone-mode: false
      - name: Check out the reviewed provider test fixtures
        uses: actions/checkout@v4
        with:
          repository: Alibaba-Agent-Sandbox/awesome-providers
          ref: bcc0016ad5285a0426d35c55085728d9ddd72141
          path: vendor/awesome-providers
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        env:
          ABX_SERVER_SDK_SRC: ${{ github.workspace }}/vendor/python-sdk/server-sdk/src
          ABX_AWESOME_PROVIDERS: ${{ github.workspace }}/vendor/awesome-providers
        run: npm test
      - name: Pack and install the exact publication artifact
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          npm install --global --prefix "$RUNNER_TEMP/abx-candidate" ./dist-pack/*.tgz
          node scripts/check-release-artifact.mjs "$RUNNER_TEMP/abx-candidate/bin/abx"
      - name: Preserve the tested npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-candidate
          path: ./dist-pack/*.tgz
          if-no-files-found: error
      - name: Publish the tested tarball with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_API_TOKEN }}
        run: npm publish ./dist-pack/*.tgz --provenance --access public --tag "$NPM_DIST_TAG"
      - name: Install from the public npm registry
        run: |
          version="$(node -p "require('./package.json').version")"
          installed=false
          for attempt in 1 2 3 4 5 6; do
            if npm install --global --prefix "$RUNNER_TEMP/abx-public" "@agent-sandbox/cli@$version" --registry=https://registry.npmjs.org; then
              installed=true
              break
            fi
            sleep 5
          done
          [ "$installed" = true ]
          node scripts/check-release-artifact.mjs "$RUNNER_TEMP/abx-public/bin/abx"
