name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check for local paths and credential-like strings
        run: npm run check:hygiene

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out the Python server SDK
        uses: actions/checkout@v4
        with:
          repository: alibaba-agent-sandbox/python-sdk
          # Reviewed public SDK6 and migrated-test dependency: https://github.com/Alibaba-Agent-Sandbox/python-sdk/pull/131
          ref: 8e610a3658040d8d6973e7951f9590ea50a4d70a
          path: vendor/python-sdk
          sparse-checkout: |
            server-sdk/src
            client-sdk/tests
          sparse-checkout-cone-mode: false

      - name: Check out the provider catalog
        uses: actions/checkout@v4
        with:
          repository: alibaba-agent-sandbox/awesome-providers
          # Reviewed provider integration dependency: https://github.com/Alibaba-Agent-Sandbox/awesome-providers/pull/40
          ref: 126a50e3c4e4c6792019b9c96674d35a9518d8ad
          path: vendor/awesome-providers

      - name: Check out the shared authentication test contract
        uses: actions/checkout@v4
        with:
          repository: Alibaba-Agent-Sandbox/python-sdk
          ref: 98642ae6712a5017e187cae7952a2b3c819c1ece
          path: vendor/auth-contract
          sparse-checkout: contracts/testing/application-auth-vectors.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify shared authentication test fixture
        run: cmp tests/fixtures/application-auth-vectors.json vendor/auth-contract/contracts/testing/application-auth-vectors.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        env:
          ABX_SERVER_SDK_SRC: ${{ github.workspace }}/vendor/python-sdk/server-sdk/src
          ABX_AWESOME_PROVIDERS: ${{ github.workspace }}/vendor/awesome-providers
        run: npm test

      - name: Parity coverage check
        env:
          PYTHON_SDK_ROOT: ${{ github.workspace }}/vendor/python-sdk
          ABX_SERVER_SDK_SRC: ${{ github.workspace }}/vendor/python-sdk/server-sdk/src
        run: npm run parity:coverage

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify pinned standard source replay and complete attribution
        run: |
          npm run test:standard-provenance
          npm ci --prefix vendor/e2b-cli
          npm run vendor:e2b
          git diff --exit-code -- src/standard_cli vendor/e2b-cli/sources.json

      - name: Pack npm tarball
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack

      - name: Verify the abx entry point is in the package
        run: |
          tarball=$(ls dist-pack/*.tgz)
          if tar -tzf "$tarball" | grep -q '^package/dist/bin/abx.js$'; then
            echo "✓ dist/bin/abx.js found in package"
          else
            echo "✗ dist/bin/abx.js NOT found in package" >&2
            exit 1
          fi

      - name: Verify the actual installed npm artifact
        run: |
          npm install --global --prefix "$RUNNER_TEMP/abx-package-check" ./dist-pack/*.tgz
          node scripts/check-release-artifact.mjs "$RUNNER_TEMP/abx-package-check/bin/abx"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-pack/

  installer:
    name: Installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck install.sh
        run: shellcheck -s sh install.sh

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test install.sh against a local release
        run: node --test tests/install/install.test.mjs
