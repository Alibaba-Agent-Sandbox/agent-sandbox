name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check for local paths and credential-like strings
        run: npm run check:hygiene

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out the Python server SDK
        uses: actions/checkout@v4
        with:
          repository: alibaba-agent-sandbox/python-sdk
          path: vendor/python-sdk
          sparse-checkout: server-sdk/src
          sparse-checkout-cone-mode: false

      - name: Check out the provider catalog
        uses: actions/checkout@v4
        with:
          repository: alibaba-agent-sandbox/awesome-providers
          path: vendor/awesome-providers

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        env:
          ABX_SERVER_SDK_SRC: ${{ github.workspace }}/vendor/python-sdk/server-sdk/src
          ABX_AWESOME_PROVIDERS: ${{ github.workspace }}/vendor/awesome-providers
        run: npm test

      - name: Parity coverage check
        env:
          ABX_SERVER_SDK_SRC: ${{ github.workspace }}/vendor/python-sdk/server-sdk/src
        run: npm run parity:coverage

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack npm tarball
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack

      - name: Verify the abx entry point is in the package
        run: |
          tarball=$(ls dist-pack/*.tgz)
          if tar -tzf "$tarball" | grep -q '^package/dist/bin/abx.js$'; then
            echo "✓ dist/bin/abx.js found in package"
          else
            echo "✗ dist/bin/abx.js NOT found in package" >&2
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist-pack/

  installer:
    name: Installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck install.sh
        run: shellcheck -s sh install.sh

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test install.sh against a local release
        run: node --test tests/install/install.test.mjs
