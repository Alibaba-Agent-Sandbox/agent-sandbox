specVersion: 1
name: agents-api
sandbox:
  template:
    source:
      dockerfile: Dockerfile
    props:
      cpu: 2
      memory: 4096
deployment:
  edition: 3.0.0
  access: default
  vars:
    region: cn-hangzhou
  resources:
    publicApi:
      component: fc3@0.1.26
      props:
        region: ${vars.region}
        cpu: 1
        memorySize: 1024
    sessionWorker:
      component: fc3@0.1.26
      props:
        region: ${vars.region}
        cpu: 2
        memorySize: 2048
    scheduler:
      component: fc3@0.1.26
      props:
        region: ${vars.region}
        cpu: 2
        memorySize: 2048
application:
  type: agents-api
  roles:
    gateway: publicApi
    worker: sessionWorker
    dispatcher: scheduler
  server:
    image: registry.example.test/agents@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  state:
    databaseUrl: ${env('ABX_TEST_MANAGED_DATABASE',
      'postgresql://private:private@database.test/agents')}
  bindings:
    sandboxAccess:
      apiKey: ${env('ABX_TEST_MANAGED_SANDBOX', 'private-sandbox-key')}
      baseUrl: https://api.cn-hangzhou.e2b.fc.aliyuncs.com
      domain: cn-hangzhou.e2b.fc.aliyuncs.com
      region: cn-hangzhou
    model:
      apiKey: ${env('ABX_TEST_MANAGED_MODEL', 'private-model-key')}
      baseUrl: https://model.test/v1
      model: qwen3.5-plus
      adapter: qwen-code
    ingress:
      kind: function-alias
      allowTestDomain: true
    internalAuth:
      generate: true
      roleArn: acs:ram::123:role/managed-agents
