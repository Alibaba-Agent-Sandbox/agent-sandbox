specVersion: 1
name: resource-example
sandbox:
  agent:
    provider: alicloud-express
    template:
      region: cn-hangzhou
      # Set an existing writable repository and a new tag before deployment.
      image: registry.example.com/your-namespace/agent:unique-version
      buildConfig:
        dockerfile: guest/Dockerfile
        # context defaults to guest, the Dockerfile's directory.
      generation: 2
      cpu: 2
      memorySize: 4096
      diskSize: 15360
      internetAccess: true
